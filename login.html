<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in or create your SneakersLink account."
    >

    <meta
        name="theme-color"
        content="#088178"
    >

    <title>Sign In / Sign Up — SneakersLink</title>

    <!-- =====================================================
         FONTS & ICONS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Spartan:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
    >

    <!-- =====================================================
         THEME — APPLY BEFORE PAGE PAINT
    ====================================================== -->

    <script>
        (() => {
            try {
                const saved =
                    localStorage.getItem("sl_theme");

                const theme =
                    saved === "dark" ||
                    saved === "light"
                        ? saved
                        : (
                            window.matchMedia &&
                            window.matchMedia(
                                "(prefers-color-scheme: dark)"
                            ).matches
                                ? "dark"
                                : "light"
                        );

                document.documentElement
                    .setAttribute(
                        "data-theme",
                        theme
                    );

            } catch (error) {
                document.documentElement
                    .setAttribute(
                        "data-theme",
                        "light"
                    );
            }
        })();
    </script>

    <!-- =====================================================
         PAGE STYLES
    ====================================================== -->

    <style>
        :root {
            --brand: #088178;
            --brand-dark: #066b63;

            --surface: #ffffff;
            --surface-soft: #f7f9fa;

            --input-bg: #e3e6f3;

            --text: #1a1a1a;
            --text-muted: #777777;

            --border: #e5e7eb;

            --danger: #dc2626;
            --success: #087f5b;

            --shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            --radius: 16px;
        }

        [data-theme="dark"] {
            --brand: #35d6c4;
            --brand-dark: #22a897;

            --surface: #12212f;
            --surface-soft: #0d1a25;

            --input-bg: #16232f;

            --text: #f2f5f7;
            --text-muted: #a9bac6;

            --border:
                rgba(255, 255, 255, 0.10);

            --danger: #ff7777;
            --success: #35d6c4;

            --shadow:
                0 25px 70px rgba(0, 0, 0, 0.55);
        }

        /* =================================================
           RESET
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                "Spartan",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                var(--surface-soft);

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
        }

        /* =================================================
           AUTH PAGE
        ================================================== */

        .login-container {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 20px;

            position: relative;

            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(0, 60, 50, 0.84),
                    rgba(0, 60, 50, 0.76)
                ),
                url("img/signup.jpeg");

            background-size: cover;
            background-position: center;

            animation:
                backgroundZoom
                20s
                ease-in-out
                infinite
                alternate;
        }

        @keyframes backgroundZoom {
            from {
                background-size: 100%;
            }

            to {
                background-size: 112%;
            }
        }

        /* =================================================
           TOP CONTROLS
        ================================================== */

        .back-link {
            position: absolute;

            top: 24px;
            left: 24px;

            display: inline-flex;
            align-items: center;

            gap: 8px;

            color: #ffffff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            opacity: 0.92;

            z-index: 10;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
            transform: translateX(-2px);
        }

        .theme-toggle {
            position: absolute;

            top: 20px;
            right: 24px;

            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 255, 255, 0.4);

            background:
                rgba(0, 0, 0, 0.12);

            color: #ffffff;

            cursor: pointer;

            z-index: 10;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .theme-toggle:hover {
            transform:
                rotate(12deg)
                scale(1.05);

            background:
                rgba(255, 255, 255, 0.12);
        }

        .theme-toggle:focus-visible,
        .back-link:focus-visible,
        .auth-tab:focus-visible,
        .submit-btn:focus-visible,
        .toggle-pass:focus-visible,
        .forgot-password:focus-visible {
            outline:
                3px solid
                rgba(53, 214, 196, 0.55);

            outline-offset: 3px;
        }

        /* =================================================
           FORM CARD
        ================================================== */

        .form-box {
            width: 100%;
            max-width: 450px;

            padding: 40px 36px 38px;

            background:
                var(--surface);

            border:
                1px solid
                var(--border);

            border-radius:
                var(--radius);

            box-shadow:
                var(--shadow);

            text-align: center;

            position: relative;

            z-index: 2;

            animation:
                riseIn
                0.55s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform:
                    translateY(18px)
                    scale(0.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =================================================
           BRAND
        ================================================== */

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-bottom: 22px;

            color:
                var(--brand);

            font-size: 20px;
            font-weight: 900;

            letter-spacing: 0.5px;
        }

        .brand-logo i {
            font-size: 19px;
        }

        /* =================================================
           TABS
        ================================================== */

        .auth-tabs {
            width: 100%;

            display: flex;

            gap: 4px;

            padding: 4px;

            margin-bottom: 28px;

            background:
                var(--input-bg);

            border-radius:
                999px;
        }

        .auth-tab {
            flex: 1;

            border: 0;

            padding: 11px 8px;

            border-radius:
                999px;

            background:
                transparent;

            color:
                var(--text-muted);

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .auth-tab:hover {
            color:
                var(--text);
        }

        .auth-tab[aria-selected="true"] {
            background:
                var(--brand);

            color: #ffffff;

            box-shadow:
                0 6px 18px
                rgba(
                    8,
                    129,
                    120,
                    0.30
                );
        }

        /* =================================================
           HEADING
        ================================================== */

        h1 {
            margin-bottom: 7px;

            color:
                var(--text);

            font-size: 25px;

            line-height: 1.25;

            font-weight: 800;
        }

        .subtitle {
            margin-bottom: 25px;

            color:
                var(--text-muted);

            font-size: 12.5px;

            line-height: 1.6;
        }

        /* =================================================
           STATUS
        ================================================== */

        .status-banner {
            display: none;

            padding: 11px 13px;

            margin-bottom: 18px;

            border-radius: 8px;

            background:
                rgba(
                    220,
                    38,
                    38,
                    0.10
                );

            color:
                var(--danger);

            font-size: 12px;

            line-height: 1.5;

            text-align: left;
        }

        .status-banner.show {
            display: block;

            animation:
                riseIn
                0.25s
                ease;
        }

        .status-banner.success {
            background:
                rgba(
                    8,
                    127,
                    91,
                    0.10
                );

            color:
                var(--success);
        }

        /* =================================================
           INPUT GROUP
        ================================================== */

        .input-field {
            width: 100%;

            display: flex;
            align-items: center;

            margin-bottom: 5px;

            background:
                var(--input-bg);

            border:
                1px solid
                transparent;

            border-radius: 8px;

            overflow: hidden;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.25s ease,
                max-height 0.3s ease;
        }

        .input-field:focus-within {
            border-color:
                var(--brand);

            box-shadow:
                0 0 0 3px
                rgba(
                    8,
                    129,
                    120,
                    0.14
                );
        }

        .input-field.field-error {
            border-color:
                var(--danger);

            animation:
                shakeField
                0.35s
                ease;
        }

        @keyframes shakeField {
            0%,
            100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-5px);
            }

            75% {
                transform:
                    translateX(5px);
            }
        }

        .input-icon {
            width: 45px;

            flex-shrink: 0;

            color:
                #8d959b;

            font-size: 13px;
        }

        .input-field input {
            width: 100%;

            min-width: 0;

            border: 0;
            outline: 0;

            background:
                transparent;

            color:
                var(--text);

            padding: 15px 10px 15px 0;

            font-size: 13px;
        }

        .input-field input::placeholder {
            color:
                var(--text-muted);

            opacity: 0.9;
        }

        .toggle-pass {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: 0;

            background:
                transparent;

            color:
                #8d959b;

            cursor: pointer;
        }

        .toggle-pass:hover {
            color:
                var(--brand);
        }

        /* =================================================
           HIDDEN SIGN-UP FIELD
        ================================================== */

        .field-hidden {
            display: none;
        }

        /* =================================================
           ERROR MESSAGE
        ================================================== */

        .error-msg {
            display: block;

            min-height: 14px;

            margin:
                0 0 10px 4px;

            color:
                var(--danger);

            font-size: 11px;

            line-height: 1.4;

            text-align: left;
        }

        /* =================================================
           FORGOT PASSWORD
        ================================================== */

        .link-row {
            display: flex;

            justify-content:
                flex-end;

            margin:
                3px 2px 18px;
        }

        .forgot-password {
            border: 0;

            background:
                transparent;

            color:
                var(--brand);

            font-size: 11.5px;

            font-weight: 700;

            cursor: pointer;

            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration:
                underline;
        }

        /* =================================================
           TERMS
        ================================================== */

        .terms-container {
            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin:
                4px 0 19px;

            color:
                var(--text-muted);

            font-size: 11.5px;

            line-height: 1.55;

            text-align: left;
        }

        .terms-container input {
            width: 15px;
            height: 15px;

            flex-shrink: 0;

            margin-top: 2px;

            accent-color:
                var(--brand);

            cursor: pointer;
        }

        .terms-container a {
            color:
                var(--brand);

            font-weight: 700;

            text-decoration: none;
        }

        .terms-container a:hover {
            text-decoration:
                underline;
        }

        /* =================================================
           SUBMIT BUTTON
        ================================================== */

        .submit-btn {
            width: 100%;

            min-height: 47px;

            border: 0;

            border-radius: 8px;

            background:
                var(--brand);

            color: #ffffff;

            cursor: pointer;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.2px;

            transition:
                background 0.2s ease,
                transform 0.15s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            background:
                var(--brand-dark);

            box-shadow:
                0 8px 20px
                rgba(
                    8,
                    129,
                    120,
                    0.25
                );
        }

        .submit-btn:active {
            transform:
                scale(0.985);
        }

        .submit-btn:disabled {
            opacity: 0.65;

            cursor:
                not-allowed;

            box-shadow:
                none;
        }

        .btn-spinner {
            display: none;

            width: 16px;
            height: 16px;

            margin-right: 8px;

            vertical-align: -3px;

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            border-top-color:
                #ffffff;

            border-radius: 50%;

            animation:
                spin
                0.7s
                linear
                infinite;
        }

        .submit-btn.loading
        .btn-spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        /* =================================================
           FIREBASE STATUS
        ================================================== */

        .firebase-status {
            margin-top: 16px;

            color:
                var(--text-muted);

            font-size: 10.5px;

            line-height: 1.5;
        }

        .firebase-status strong {
            color:
                var(--brand);
        }

        /* =================================================
           FOOTER NOTE
        ================================================== */

        .security-note {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 6px;

            margin-top: 22px;

            color:
                var(--text-muted);

            font-size: 10px;
        }

        .security-note i {
            color:
                var(--brand);
        }

        /* =================================================
           REDUCED MOTION
        ================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {
            *,
            *::before,
            *::after {
                scroll-behavior:
                    auto !important;

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

        /* =================================================
           MOBILE
        ================================================== */

        @media (max-width: 520px) {
            .login-container {
                padding:
                    70px 14px 30px;

                align-items:
                    flex-start;

                background-position:
                    center;
            }

            .form-box {
                max-width:
                    100%;

                padding:
                    30px 22px 28px;

                border-radius:
                    13px;
            }

            .back-link {
                top: 18px;
                left: 16px;
            }

            .theme-toggle {
                top: 16px;
                right: 16px;
            }

            h1 {
                font-size: 22px;
            }

            .brand-logo {
                margin-bottom: 18px;
            }

            .auth-tabs {
                margin-bottom: 23px;
            }
        }

        @media (max-height: 700px) {
            .login-container {
                align-items:
                    flex-start;

                padding-top:
                    60px;
            }

            .form-box {
                padding-top:
                    26px;
                padding-bottom:
                    26px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         AUTHENTICATION PAGE
    ====================================================== -->

    <main
        class="login-container"
        id="authPage"
    >

        <!-- BACK TO STORE -->

        <a
            href="index.html"
            class="back-link"
            aria-label="Back to SneakersLink home"
        >
            <i
                class="fas fa-arrow-left"
                aria-hidden="true"
            ></i>

            <span>
                Back to store
            </span>
        </a>


        <!-- THEME -->

        <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="Switch theme"
            title="Switch theme"
        >
            <i
                class="fas fa-moon"
                aria-hidden="true"
            ></i>
        </button>


        <!-- =================================================
             FORM CARD
        ================================================== -->

        <section
            class="form-box"
            aria-labelledby="formTitle"
        >

            <!-- BRAND -->

            <div
                class="brand-logo"
                aria-label="SneakersLink"
            >
                <i
                    class="fas fa-shoe-prints"
                    aria-hidden="true"
                ></i>

                <span>
                    SneakersLink
                </span>
            </div>


            <!-- =================================================
                 AUTH TABS
            ================================================== -->

            <div
                class="auth-tabs"
                role="tablist"
                aria-label="Authentication options"
            >

                <button
                    type="button"
                    class="auth-tab"
                    id="signupTab"
                    role="tab"
                    aria-selected="true"
                    aria-controls="authForm"
                    tabindex="0"
                >
                    Create Account
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="loginTab"
                    role="tab"
                    aria-selected="false"
                    aria-controls="authForm"
                    tabindex="-1"
                >
                    Sign In
                </button>

            </div>


            <!-- HEADING -->

            <h1 id="formTitle">
                Create your account
            </h1>

            <p
                class="subtitle"
                id="formSubtitle"
            >
                Join SneakersLink and enjoy a
                faster, easier shopping experience.
            </p>


            <!-- STATUS -->

            <div
                id="statusBanner"
                class="status-banner"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 AUTH FORM
            ================================================== -->

            <form
                id="authForm"
                novalidate
                autocomplete="on"
            >

                <!-- NAME -->

                <div
                    class="input-field"
                    id="nameField"
                >

                    <span
                        class="input-icon"
                        aria-hidden="true"
                    >
                        <i class="fas fa-user"></i>
                    </span>

                    <input
                        id="nameInput"
                        name="name"
                        type="text"
                        autocomplete="name"
                        placeholder="Full name"
                        maxlength="120"
                        aria-describedby="nameError"
                    >

                </div>

                <span
                    class="error-msg"
                    id="nameError"
                    aria-live="polite"
                ></span>


                <!-- EMAIL -->

                <div
                    class="input-field"
                    id="emailField"
                >

                    <span
                        class="input-icon"
                        aria-hidden="true"
                    >
                        <i class="fas fa-envelope"></i>
                    </span>

                    <input
                        id="emailInput"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="Email address"
                        maxlength="254"
                        required
                        aria-required="true"
                        aria-describedby="emailError"
                    >

                </div>

                <span
                    class="error-msg"
                    id="emailError"
                    aria-live="polite"
                ></span>


                <!-- PASSWORD -->

                <div
                    class="input-field"
                    id="passwordField"
                >

                    <span
                        class="input-icon"
                        aria-hidden="true"
                    >
                        <i class="fas fa-lock"></i>
                    </span>

                    <input
                        id="passwordInput"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Password"
                        minlength="6"
                        required
                        aria-required="true"
                        aria-describedby="passwordError"
                    >

                    <button
                        type="button"
                        class="toggle-pass"
                        id="togglePassword"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <i
                            class="fas fa-eye"
                            aria-hidden="true"
                        ></i>
                    </button>

                </div>

                <span
                    class="error-msg"
                    id="passwordError"
                    aria-live="polite"
                ></span>


                <!-- CONFIRM PASSWORD -->

                <div
                    class="input-field"
                    id="confirmField"
                >

                    <span
                        class="input-icon"
                        aria-hidden="true"
                    >
                        <i class="fas fa-lock"></i>
                    </span>

                    <input
                        id="confirmInput"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Confirm password"
                        minlength="6"
                        aria-describedby="confirmError"
                    >

                    <button
                        type="button"
                        class="toggle-pass"
                        id="toggleConfirm"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <i
                            class="fas fa-eye"
                            aria-hidden="true"
                        ></i>
                    </button>

                </div>

                <span
                    class="error-msg"
                    id="confirmError"
                    aria-live="polite"
                ></span>


                <!-- FORGOT PASSWORD -->

                <div
                    class="link-row"
                    id="forgotRow"
                >

                    <button
                        type="button"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot your password?
                    </button>

                </div>


                <!-- TERMS -->

                <div
                    class="terms-container"
                    id="termsContainer"
                >

                    <input
                        id="termsCheck"
                        name="terms"
                        type="checkbox"
                        aria-describedby="termsText"
                    >

                    <label
                        for="termsCheck"
                        id="termsText"
                    >
                        I agree to the SneakersLink
                        <a
                            href="terms.html"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Terms &amp; Conditions
                        </a>
                        and
                        <a
                            href="privacy.html"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Privacy Policy
                        </a>.
                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >

                    <span
                        class="btn-spinner"
                        aria-hidden="true"
                    ></span>

                    <span
                        id="submitText"
                    >
                        Create Account
                    </span>

                </button>

            </form>


            <!-- FIREBASE STATUS -->

            <p
                class="firebase-status"
                id="firebaseStatus"
                aria-live="polite"
            >
                Connecting to
                <strong>secure authentication</strong>…
            </p>


            <!-- SECURITY -->

            <div
                class="security-note"
            >

                <i
                    class="fas fa-shield-alt"
                    aria-hidden="true"
                ></i>

                <span>
                    Your account is secured by
                    Firebase Authentication.
                </span>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FIREBASE AUTHENTICATION
    ====================================================== -->

    <script
        type="module"
        src="firebase-auth.js"
    ></script>


    <!-- =====================================================
         PAGE LOGIC
    ====================================================== -->

    <script>
        (() => {
            "use strict";


            /* =================================================
               ELEMENTS
            ================================================= */

            const form =
                document.getElementById(
                    "authForm"
                );

            const signupTab =
                document.getElementById(
                    "signupTab"
                );

            const loginTab =
                document.getElementById(
                    "loginTab"
                );

            const formTitle =
                document.getElementById(
                    "formTitle"
                );

            const formSubtitle =
                document.getElementById(
                    "formSubtitle"
                );

            const nameField =
                document.getElementById(
                    "nameField"
                );

            const confirmField =
                document.getElementById(
                    "confirmField"
                );

            const termsContainer =
                document.getElementById(
                    "termsContainer"
                );

            const forgotRow =
                document.getElementById(
                    "forgotRow"
                );

            const nameInput =
                document.getElementById(
                    "nameInput"
                );

            const emailInput =
                document.getElementById(
                    "emailInput"
                );

            const passwordInput =
                document.getElementById(
                    "passwordInput"
                );

            const confirmInput =
                document.getElementById(
                    "confirmInput"
                );

            const termsCheck =
                document.getElementById(
                    "termsCheck"
                );

            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );

            const submitText =
                document.getElementById(
                    "submitText"
                );

            const statusBanner =
                document.getElementById(
                    "statusBanner"
                );

            const firebaseStatus =
                document.getElementById(
                    "firebaseStatus"
                );

            const themeToggle =
                document.getElementById(
                    "themeToggle"
                );


            /* =================================================
               STATE
            ================================================= */

            let mode =
                "signup";

            let authReady =
                false;

            let redirecting =
                false;


            /* =================================================
               BASIC HELPERS
            ================================================= */

            function setError(
                fieldId,
                errorId,
                message
            ) {
                const field =
                    document.getElementById(
                        fieldId
                    );

                const error =
                    document.getElementById(
                        errorId
                    );

                if (field) {
                    field.classList.toggle(
                        "field-error",
                        Boolean(message)
                    );
                }

                if (error) {
                    error.textContent =
                        message || "";
                }
            }


            function clearErrors() {
                setError(
                    "nameInput",
                    "nameError",
                    ""
                );

                setError(
                    "emailInput",
                    "emailError",
                    ""
                );

                setError(
                    "passwordInput",
                    "passwordError",
                    ""
                );

                setError(
                    "confirmInput",
                    "confirmError",
                    ""
                );

                termsContainer.style.color =
                    "";
            }


            function showStatus(
                message,
                type = "error"
            ) {
                statusBanner.textContent =
                    message;

                statusBanner.classList.toggle(
                    "success",
                    type === "success"
                );

                statusBanner.classList.add(
                    "show"
                );
            }


            function hideStatus() {
                statusBanner.textContent =
                    "";

                statusBanner.classList.remove(
                    "show",
                    "success"
                );
            }


            function setLoading(
                loading
            ) {
                submitBtn.disabled =
                    loading;

                submitBtn.classList.toggle(
                    "loading",
                    loading
                );

                if (loading) {
                    submitText.textContent =
                        mode === "signup"
                            ? "Creating account…"
                            : "Signing in…";
                } else {
                    submitText.textContent =
                        mode === "signup"
                            ? "Create Account"
                            : "Sign In";
                }
            }


            function setMode(
                nextMode
            ) {
                mode =
                    nextMode === "login"
                        ? "login"
                        : "signup";

                const signup =
                    mode === "signup";


                /* -----------------------------------------
                   TAB STATE
                ----------------------------------------- */

                signupTab.setAttribute(
                    "aria-selected",
                    String(signup)
                );

                loginTab.setAttribute(
                    "aria-selected",
                    String(!signup)
                );

                signupTab.tabIndex =
                    signup ? 0 : -1;

                loginTab.tabIndex =
                    signup ? -1 : 0;


                /* -----------------------------------------
                   TEXT
                ----------------------------------------- */

                formTitle.textContent =
                    signup
                        ? "Create your account"
                        : "Welcome back";

                formSubtitle.textContent =
                    signup
                        ? "Join SneakersLink and enjoy a faster, easier shopping experience."
                        : "Sign in to manage your SneakersLink account and orders.";


                /* -----------------------------------------
                   SIGNUP-ONLY FIELDS
                ----------------------------------------- */

                nameField.classList.toggle(
                    "field-hidden",
                    !signup
                );

                confirmField.classList.toggle(
                    "field-hidden",
                    !signup
                );

                termsContainer.style.display =
                    signup
                        ? "flex"
                        : "none";


                /* -----------------------------------------
                   FORGOT PASSWORD
                ----------------------------------------- */

                forgotRow.style.display =
                    signup
                        ? "none"
                        : "flex";


                /* -----------------------------------------
                   AUTOCOMPLETE
                ----------------------------------------- */

                nameInput.required =
                    signup;

                confirmInput.required =
                    signup;

                passwordInput.autocomplete =
                    signup
                        ? "new-password"
                        : "current-password";


                /* -----------------------------------------
                   BUTTON
                ----------------------------------------- */

                submitText.textContent =
                    signup
                        ? "Create Account"
                        : "Sign In";


                clearErrors();
                hideStatus();
            }


            /* =================================================
               PASSWORD VISIBILITY
            ================================================= */

            function setupPasswordToggle(
                buttonId,
                inputId
            ) {
                const button =
                    document.getElementById(
                        buttonId
                    );

                const input =
                    document.getElementById(
                        inputId
                    );

                if (!button || !input) {
                    return;
                }

                button.addEventListener(
                    "click",
                    () => {
                        const visible =
                            input.type ===
                            "text";

                        input.type =
                            visible
                                ? "password"
                                : "text";

                        const icon =
                            button.querySelector(
                                "i"
                            );

                        if (icon) {
                            icon.className =
                                visible
                                    ? "fas fa-eye"
                                    : "fas fa-eye-slash";
                        }

                        button.setAttribute(
                            "aria-label",
                            visible
                                ? "Show password"
                                : "Hide password"
                        );

                        button.setAttribute(
                            "title",
                            visible
                                ? "Show password"
                                : "Hide password"
                        );
                    }
                );
            }


            setupPasswordToggle(
                "togglePassword",
                "passwordInput"
            );

            setupPasswordToggle(
                "toggleConfirm",
                "confirmInput"
            );


            /* =================================================
               TAB EVENTS
            ================================================= */

            signupTab.addEventListener(
                "click",
                () =>
                    setMode("signup")
            );

            loginTab.addEventListener(
                "click",
                () =>
                    setMode("login")
            );


            signupTab.addEventListener(
                "keydown",
                (event) => {
                    if (
                        event.key ===
                        "ArrowRight"
                    ) {
                        event.preventDefault();

                        loginTab.focus();

                        setMode(
                            "login"
                        );
                    }
                }
            );


            loginTab.addEventListener(
                "keydown",
                (event) => {
                    if (
                        event.key ===
                        "ArrowLeft"
                    ) {
                        event.preventDefault();

                        signupTab.focus();

                        setMode(
                            "signup"
                        );
                    }
                }
            );


            /* =================================================
               VALIDATION
            ================================================= */

            function validateForm() {
                clearErrors();

                let valid =
                    true;

                const name =
                    nameInput.value.trim();

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;

                const confirm =
                    confirmInput.value;


                /* -----------------------------------------
                   NAME
                ----------------------------------------- */

                if (
                    mode === "signup" &&
                    (
                        !name ||
                        name.length < 2
                    )
                ) {
                    setError(
                        "nameInput",
                        "nameError",
                        "Please enter your full name."
                    );

                    valid =
                        false;
                }


                /* -----------------------------------------
                   EMAIL
                ----------------------------------------- */

                if (
                    !email ||
                    !emailInput.checkValidity()
                ) {
                    setError(
                        "emailInput",
                        "emailError",
                        "Please enter a valid email address."
                    );

                    valid =
                        false;
                }


                /* -----------------------------------------
                   PASSWORD
                ----------------------------------------- */

                if (
                    !password ||
                    password.length < 6
                ) {
                    setError(
                        "passwordInput",
                        "passwordError",
                        "Password must contain at least 6 characters."
                    );

                    valid =
                        false;
                }


                /* -----------------------------------------
                   CONFIRM PASSWORD
                ----------------------------------------- */

                if (
                    mode === "signup" &&
                    password !== confirm
                ) {
                    setError(
                        "confirmInput",
                        "confirmError",
                        "Passwords do not match."
                    );

                    valid =
                        false;
                }


                /* -----------------------------------------
                   TERMS
                ----------------------------------------- */

                if (
                    mode === "signup" &&
                    !termsCheck.checked
                ) {
                    termsContainer.style.color =
                        "var(--danger)";

                    valid =
                        false;
                }


                return {
                    valid,
                    name,
                    email,
                    password,
                };
            }


            /* =================================================
               FIREBASE ERROR NORMALISATION
            ================================================= */

            function getErrorMessage(
                error
            ) {
                if (
                    error &&
                    error.message
                ) {
                    return error.message;
                }

                const code =
                    error?.code || "";

                const messages = {
                    "auth/invalid-email":
                        "Please enter a valid email address.",

                    "auth/user-not-found":
                        "No account was found with this email address.",

                    "auth/wrong-password":
                        "The email or password is incorrect.",

                    "auth/invalid-credential":
                        "The email or password is incorrect.",

                    "auth/email-already-in-use":
                        "An account already exists with this email address.",

                    "auth/weak-password":
                        "Your password is too weak. Please choose a stronger password.",

                    "auth/too-many-requests":
                        "Too many attempts were made. Please try again later.",

                    "auth/network-request-failed":
                        "A network error occurred. Please check your internet connection.",

                    "auth/user-disabled":
                        "This account has been disabled.",

                    "auth/operation-not-allowed":
                        "Email/password authentication is not enabled."
                };

                return (
                    messages[code] ||
                    "Authentication failed. Please try again."
                );
            }


            /* =================================================
               SUBMIT
            ================================================= */

            form.addEventListener(
                "submit",
                async (event) => {
                    event.preventDefault();

                    if (
                        redirecting ||
                        submitBtn.disabled
                    ) {
                        return;
                    }

                    hideStatus();

                    const data =
                        validateForm();

                    if (!data.valid) {
                        return;
                    }


                    /* -----------------------------------------
                       FIREBASE AVAILABILITY
                    ----------------------------------------- */

                    if (
                        !window.SLAuth ||
                        !window.SLAuth.isConfigured
                    ) {
                        showStatus(
                            "Firebase authentication is not configured. Please check firebase-config.js."
                        );

                        return;
                    }

                    if (!authReady) {
                        showStatus(
                            "Authentication is still loading. Please try again in a moment."
                        );

                        return;
                    }


                    setLoading(true);


                    try {

                        /* =====================================
                           SIGN UP
                        ====================================== */

                        if (
                            mode ===
                            "signup"
                        ) {

                            /*
                             * IMPORTANT:
                             *
                             * firebase-auth.js expects:
                             *
                             * register(
                             *     email,
                             *     password,
                             *     profile
                             * )
                             *
                             * The old page incorrectly passed:
                             *
                             * register(
                             *     name,
                             *     email,
                             *     password
                             * )
                             */

                            await window.SLAuth.register(
                                data.email,
                                data.password,
                                {
                                    displayName:
                                        data.name
                                }
                            );


                            showStatus(
                                "Account created successfully. Welcome to SneakersLink!",
                                "success"
                            );

                        }


                        /* =====================================
                           SIGN IN
                        ====================================== */

                        else {

                            await window.SLAuth.login(
                                data.email,
                                data.password
                            );


                            showStatus(
                                "Welcome back! Redirecting you to the store…",
                                "success"
                            );

                        }


                        /* -------------------------------------
                           REDIRECT
                        ------------------------------------- */

                        redirecting =
                            true;

                        window.setTimeout(
                            () => {
                                window.location.href =
                                    "index.html";
                            },
                            900
                        );


                    } catch (error) {

                        console.error(
                            "[SneakersLink] Authentication error:",
                            error
                        );

                        showStatus(
                            getErrorMessage(
                                error
                            )
                        );


                        /* -------------------------------------
                           FOCUS APPROPRIATE FIELD
                        ------------------------------------- */

                        const code =
                            error?.code ||
                            "";

                        if (
                            code ===
                                "auth/invalid-email" ||
                            code ===
                                "auth/email-already-in-use"
                        ) {
                            emailInput.focus();

                        } else if (
                            code ===
                                "auth/weak-password"
                        ) {
                            passwordInput.focus();

                        } else {
                            emailInput.focus();
                        }


                    } finally {

                        if (!redirecting) {
                            setLoading(
                                false
                            );
                        }
                    }
                }
            );


            /* =================================================
               PASSWORD RESET
            ================================================= */

            document
                .getElementById(
                    "forgotPassword"
                )
                .addEventListener(
                    "click",
                    async () => {

                        const email =
                            emailInput.value
                                .trim()
                                .toLowerCase();


                        if (
                            !email ||
                            !emailInput.checkValidity()
                        ) {
                            setError(
                                "emailInput",
                                "emailError",
                                "Enter your email address first."
                            );

                            emailInput.focus();

                            return;
                        }


                        if (
                            !window.SLAuth ||
                            !window.SLAuth.isConfigured
                        ) {
                            showStatus(
                                "Firebase authentication is not configured."
                            );

                            return;
                        }


                        try {

                            await window.SLAuth.resetPassword(
                                email
                            );


                            showStatus(
                                "If an account exists for that email, a password-reset email has been sent.",
                                "success"
                            );


                        } catch (error) {

                            console.error(
                                "[SneakersLink] Password reset error:",
                                error
                            );

                            showStatus(
                                getErrorMessage(
                                    error
                                )
                            );
                        }
                    }
                );


            /* =================================================
               FIREBASE READY
            ================================================= */

            function handleFirebaseReady() {

                if (
                    window.SLAuth &&
                    window.SLAuth.isConfigured
                ) {

                    authReady =
                        true;

                    firebaseStatus.innerHTML =
                        '<i class="fas fa-check-circle"></i> Secure authentication is ready.';

                } else {

                    firebaseStatus.innerHTML =
                        '<i class="fas fa-exclamation-circle"></i> Firebase authentication is not configured.';

                }
            }


            /*
             * firebase-auth.js dispatches:
             *
             * slauth:ready
             *
             * after its public API has been created.
             */

            if (
                window.SLAuth
            ) {

                handleFirebaseReady();

            } else {

                window.addEventListener(
                    "slauth:ready",
                    handleFirebaseReady,
                    {
                        once: true
                    }
                );

            }


            /* =================================================
               AUTH STATE
            ================================================= */

            function watchAuthentication() {

                if (
                    !window.SLAuth ||
                    typeof
                        window.SLAuth
                            .onAuthStateChanged !==
                        "function"
                ) {
                    return;
                }


                window.SLAuth
                    .onAuthStateChanged(
                        (user) => {

                            /*
                             * If the user is already signed in,
                             * don't show the login form again.
                             */

                            if (
                                user &&
                                !redirecting
                            ) {

                                showStatus(
                                    "You are already signed in. Redirecting you to the store…",
                                    "success"
                                );

                                redirecting =
                                    true;

                                window.setTimeout(
                                    () => {
                                        window.location.href =
                                            "index.html";
                                    },
                                    650
                                );
                            }
                        }
                    );
            }


            /*
             * Start auth-state monitoring once Firebase
             * becomes available.
             */

            window.addEventListener(
                "slauth:ready",
                watchAuthentication,
                {
                    once: true
                }
            );


            if (
                window.SLAuth
            ) {
                watchAuthentication();
            }


            /* =================================================
               THEME
            ================================================= */

            function updateThemeIcon() {

                const theme =
                    document.documentElement
                        .getAttribute(
                            "data-theme"
                        );

                const icon =
                    themeToggle.querySelector(
                        "i"
                    );

                if (!icon) {
                    return;
                }

                if (
                    theme ===
                    "dark"
                ) {

                    icon.className =
                        "fas fa-sun";

                    themeToggle.setAttribute(
                        "aria-label",
                        "Switch to light mode"
                    );

                    themeToggle.setAttribute(
                        "title",
                        "Switch to light mode"
                    );

                } else {

                    icon.className =
                        "fas fa-moon";

                    themeToggle.setAttribute(
                        "aria-label",
                        "Switch to dark mode"
                    );

                    themeToggle.setAttribute(
                        "title",
                        "Switch to dark mode"
                    );
                }
            }


            updateThemeIcon();


            themeToggle.addEventListener(
                "click",
                () => {

                    const current =
                        document.documentElement
                            .getAttribute(
                                "data-theme"
                            );

                    const next =
                        current === "dark"
                            ? "light"
                            : "dark";


                    document.documentElement
                        .setAttribute(
                            "data-theme",
                            next
                        );


                    try {

                        localStorage.setItem(
                            "sl_theme",
                            next
                        );

                    } catch (error) {}


                    updateThemeIcon();
                }
            );


            /* =================================================
               LIVE VALIDATION
            ================================================= */

            emailInput.addEventListener(
                "input",
                () => {
                    setError(
                        "emailInput",
                        "emailError",
                        ""
                    );

                    hideStatus();
                }
            );


            passwordInput.addEventListener(
                "input",
                () => {

                    setError(
                        "passwordInput",
                        "passwordError",
                        ""
                    );

                    if (
                        confirmInput.value
                    ) {
                        setError(
                            "confirmInput",
                            "confirmError",
                            confirmInput
                                .value ===
                                passwordInput
                                    .value
                                ? ""
                                : "Passwords do not match."
                        );
                    }

                    hideStatus();
                }
            );


            confirmInput.addEventListener(
                "input",
                () => {

                    setError(
                        "confirmInput",
                        "confirmError",
                        confirmInput.value ===
                            passwordInput.value
                            ? ""
                            : "Passwords do not match."
                    );
                }
            );


            nameInput.addEventListener(
                "input",
                () =>
                    setError(
                        "nameInput",
                        "nameError",
                        ""
                    )
            );


            termsCheck.addEventListener(
                "change",
                () => {
                    termsContainer.style.color =
                        "";
                }
            );


            /* =================================================
               ENTER / ESC UX
            ================================================= */

            document.addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key ===
                        "Escape"
                    ) {
                        hideStatus();
                    }

                }
            );


            /* =================================================
               INITIAL STATE
            ================================================= */

            setMode(
                "signup"
            );

        })();
    </script>

</body>
</html>
