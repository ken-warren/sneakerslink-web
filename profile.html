<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | SneakersLink</title>

    <meta
        name="description"
        content="Manage your SneakersLink customer profile."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =========================================================
           PROFILE PAGE
           ========================================================= */

        .profile-page {
            min-height: 100vh;
            padding: 24px;
            background: var(--bg-color, #f8f8f8);
        }


        /* =========================================================
           TOP BAR
           ========================================================= */

        .profile-topbar {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .profile-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 11px 17px;

            border-radius: 9px;

            background: transparent;

            border: 1px solid rgba(0, 0, 0, .12);

            color: var(--text-color, #222);

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                background .2s ease,
                transform .2s ease;
        }


        .profile-back-btn:hover {
            background: rgba(0, 0, 0, .05);
            transform: translateX(-2px);
        }


        /* =========================================================
           TOP RIGHT PROFILE BUTTON
           ========================================================= */

        .profile-top-account {
            position: relative;
        }


        .profile-top-avatar {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eeeeee;

            border: 2px solid rgba(0, 0, 0, .08);

            color: #333;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }


        .profile-top-avatar:hover {
            transform: scale(1.04);

            box-shadow:
                0 6px 20px rgba(0, 0, 0, .12);
        }


        .profile-top-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        .profile-top-avatar-initial {
            font-size: 17px;
            font-weight: 700;
        }


        /* =========================================================
           PROFILE CONTAINER
           ========================================================= */

        .profile-container {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;
        }


        .profile-card {
            background: var(--card-bg, #ffffff);

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 12px 40px rgba(0, 0, 0, .08);

            border: 1px solid rgba(0, 0, 0, .06);
        }


        /* =========================================================
           PROFILE HEADER
           ========================================================= */

        .profile-header {
            text-align: center;

            padding-bottom: 30px;

            border-bottom: 1px solid rgba(0, 0, 0, .08);
        }


        .profile-avatar-wrapper {
            position: relative;

            width: 120px;
            height: 120px;

            margin: 0 auto 18px;
        }


        .profile-avatar {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eeeeee;

            border: 4px solid #ffffff;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .14);

            color: #555;
        }


        .profile-avatar img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        .profile-avatar i {
            font-size: 42px;
        }


        .profile-avatar-initial {
            font-size: 40px;
            font-weight: 700;
        }


        .profile-upload-btn {
            position: absolute;

            right: 0;
            bottom: 0;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #088178;

            color: #ffffff;

            border: 3px solid #ffffff;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease;
        }


        .profile-upload-btn:hover {
            transform: scale(1.08);

            background: #066b64;
        }


        .profile-header h1 {
            margin: 0;

            font-size: 28px;

            color: var(--text-color, #222);
        }


        .profile-header p {
            margin: 7px 0 0;

            color: #777;

            font-size: 14px;
        }


        /* =========================================================
           FORM
           ========================================================= */

        .profile-form {
            padding-top: 30px;
        }


        .profile-section-title {
            margin: 0 0 18px;

            font-size: 18px;

            color: var(--text-color, #222);
        }


        .profile-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }


        .profile-field {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .profile-field.full {
            grid-column: 1 / -1;
        }


        .profile-field label {
            font-size: 13px;

            font-weight: 600;

            color: var(--text-color, #333);
        }


        .profile-field input {
            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border-radius: 9px;

            border: 1px solid #d8d8d8;

            background: #ffffff;

            color: #222;

            font-size: 14px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }


        .profile-field input:focus {
            border-color: #088178;

            box-shadow:
                0 0 0 3px rgba(8, 129, 120, .10);
        }


        .profile-field input[readonly] {
            background: #f4f4f4;

            color: #777;

            cursor: not-allowed;
        }


        /* =========================================================
           ACTIONS
           ========================================================= */

        .profile-actions {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid rgba(0, 0, 0, .08);
        }


        .profile-secondary-actions {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .profile-btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            min-height: 44px;

            padding: 11px 18px;

            border-radius: 9px;

            border: 1px solid transparent;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .profile-btn:hover {
            transform: translateY(-1px);
        }


        .profile-btn-primary {
            background: #088178;

            color: #ffffff;

            box-shadow:
                0 6px 18px rgba(8, 129, 120, .18);
        }


        .profile-btn-primary:hover {
            background: #066b64;
        }


        .profile-btn-secondary {
            background: transparent;

            border-color: #d5d5d5;

            color: #444;
        }


        .profile-btn-danger {
            color: #d62828;

            background: transparent;

            border-color: rgba(214, 40, 40, .18);
        }


        .profile-btn-danger:hover {
            background: rgba(214, 40, 40, .06);
        }


        /* =========================================================
           LOADING
           ========================================================= */

        .profile-loading {
            min-height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 15px;

            color: #777;
        }


        .profile-loading i {
            font-size: 28px;

            animation:
                profileSpin 1s linear infinite;
        }


        @keyframes profileSpin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           ERROR
           ========================================================= */

        .profile-error {
            padding: 30px;

            text-align: center;

            color: #d62828;
        }


        /* =========================================================
           HIDDEN
           ========================================================= */

        [hidden] {
            display: none !important;
        }


        /* =========================================================
           DARK MODE
           ========================================================= */

        [data-theme="dark"] .profile-page {
            background: #101010;
        }


        [data-theme="dark"] .profile-card {
            background: #181818;

            border-color: rgba(255,255,255,.08);

            box-shadow:
                0 12px 40px rgba(0,0,0,.35);
        }


        [data-theme="dark"] .profile-header {
            border-color: rgba(255,255,255,.08);
        }


        [data-theme="dark"] .profile-header h1,
        [data-theme="dark"] .profile-section-title,
        [data-theme="dark"] .profile-field label {
            color: #ffffff;
        }


        [data-theme="dark"] .profile-field input {
            background: #222222;

            border-color: #3a3a3a;

            color: #ffffff;
        }


        [data-theme="dark"] .profile-field input[readonly] {
            background: #292929;

            color: #999;
        }


        [data-theme="dark"] .profile-actions {
            border-color: rgba(255,255,255,.08);
        }


        [data-theme="dark"] .profile-btn-secondary {
            color: #eeeeee;

            border-color: #444;
        }


        [data-theme="dark"] .profile-top-avatar {
            background: #292929;

            border-color: #333;

            color: #ffffff;
        }


        [data-theme="dark"] .profile-avatar {
            background: #292929;

            border-color: #181818;

            color: #ffffff;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            .profile-page {
                padding: 15px;
            }


            .profile-topbar {
                margin-bottom: 20px;
            }


            .profile-card {
                padding: 23px 18px;

                border-radius: 14px;
            }


            .profile-grid {
                grid-template-columns: 1fr;
            }


            .profile-field.full {
                grid-column: auto;
            }


            .profile-actions {
                flex-direction: column-reverse;

                align-items: stretch;
            }


            .profile-secondary-actions {
                width: 100%;

                display: grid;

                grid-template-columns: 1fr 1fr;
            }


            .profile-secondary-actions .profile-btn {
                width: 100%;
            }


            .profile-actions > .profile-btn {
                width: 100%;
            }


            .profile-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <main class="profile-page">


        <!-- =====================================================
             TOP BAR
             ===================================================== -->

        <header class="profile-topbar">

            <a
                href="index.html"
                class="profile-back-btn"
            >
                <i
                    class="fas fa-arrow-left"
                    aria-hidden="true"
                ></i>

                Back to Store
            </a>


            <!-- PROFILE ICON -->

            <div class="profile-top-account">

                <button
                    type="button"
                    class="profile-top-avatar"
                    id="profileTopAvatar"
                    aria-label="Your profile"
                    title="Your profile"
                >
                    <i
                        class="fas fa-user"
                        aria-hidden="true"
                    ></i>
                </button>

            </div>

        </header>


        <!-- =====================================================
             PROFILE
             ===================================================== -->

        <section class="profile-container">


            <!-- LOADING -->

            <div
                class="profile-card"
                id="profileLoading"
            >

                <div class="profile-loading">

                    <i
                        class="fas fa-spinner"
                        aria-hidden="true"
                    ></i>

                    <span>
                        Loading your profile...
                    </span>

                </div>

            </div>


            <!-- ERROR -->

            <div
                class="profile-card profile-error"
                id="profileError"
                hidden
            >

                <i
                    class="fas fa-exclamation-circle"
                    aria-hidden="true"
                ></i>

                <h2>
                    Unable to load your profile
                </h2>

                <p id="profileErrorMessage">
                    Please sign in and try again.
                </p>

                <a
                    href="login.html?mode=login"
                    class="profile-btn profile-btn-primary"
                >
                    Sign In
                </a>

            </div>


            <!-- PROFILE CARD -->

            <div
                class="profile-card"
                id="profileCard"
                hidden
            >


                <!-- =================================================
                     PROFILE HEADER
                     ================================================= -->

                <div class="profile-header">

                    <div class="profile-avatar-wrapper">

                        <div
                            class="profile-avatar"
                            id="profileAvatar"
                        >

                            <i
                                class="fas fa-user"
                                aria-hidden="true"
                            ></i>

                        </div>


                        <!-- UPLOAD -->

                        <label
                            for="profileImageInput"
                            class="profile-upload-btn"
                            title="Change profile picture"
                        >

                            <i
                                class="fas fa-camera"
                                aria-hidden="true"
                            ></i>

                        </label>

                        <input
                            type="file"
                            id="profileImageInput"
                            accept="image/*"
                            hidden
                        >

                    </div>


                    <h1 id="profileName">
                        My Profile
                    </h1>


                    <p id="profileEmail">
                        —
                    </p>

                </div>


                <!-- =================================================
                     PROFILE FORM
                     ================================================= -->

                <form
                    class="profile-form"
                    id="profileForm"
                >

                    <h2 class="profile-section-title">
                        Personal Information
                    </h2>


                    <div class="profile-grid">


                        <!-- NAME -->

                        <div class="profile-field">

                            <label for="profileDisplayName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="profileDisplayName"
                                name="displayName"
                                autocomplete="name"
                                placeholder="Your full name"
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="profile-field">

                            <label for="profileEmailInput">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="profileEmailInput"
                                name="email"
                                readonly
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="profile-field">

                            <label for="profilePhone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="profilePhone"
                                name="phone"
                                autocomplete="tel"
                                placeholder="+254..."
                            >

                        </div>


                        <!-- COUNTRY -->

                        <div class="profile-field">

                            <label for="profileCountry">
                                Country
                            </label>

                            <input
                                type="text"
                                id="profileCountry"
                                name="country"
                                autocomplete="country-name"
                                placeholder="Country"
                            >

                        </div>


                        <!-- ADDRESS -->

                        <div class="profile-field full">

                            <label for="profileAddress">
                                Address
                            </label>

                            <input
                                type="text"
                                id="profileAddress"
                                name="address"
                                autocomplete="street-address"
                                placeholder="Street address"
                            >

                        </div>


                        <!-- CITY -->

                        <div class="profile-field">

                            <label for="profileCity">
                                City
                            </label>

                            <input
                                type="text"
                                id="profileCity"
                                name="city"
                                autocomplete="address-level2"
                                placeholder="City"
                            >

                        </div>


                        <!-- POSTAL CODE -->

                        <div class="profile-field">

                            <label for="profilePostalCode">
                                Postal Code
                            </label>

                            <input
                                type="text"
                                id="profilePostalCode"
                                name="postalCode"
                                autocomplete="postal-code"
                                placeholder="Postal code"
                            >

                        </div>

                    </div>


                    <!-- =================================================
                         ACTIONS
                         ================================================= -->

                    <div class="profile-actions">


                        <div class="profile-secondary-actions">

                            <button
                                type="button"
                                class="profile-btn profile-btn-secondary"
                                id="removeProfileImage"
                            >
                                <i
                                    class="fas fa-trash"
                                    aria-hidden="true"
                                ></i>

                                Remove Photo
                            </button>


                            <button
                                type="button"
                                class="profile-btn profile-btn-danger"
                                id="profileSignOut"
                            >
                                <i
                                    class="fas fa-sign-out-alt"
                                    aria-hidden="true"
                                ></i>

                                Sign Out
                            </button>

                        </div>


                        <button
                            type="submit"
                            class="profile-btn profile-btn-primary"
                            id="saveProfileBtn"
                        >

                            <i
                                class="fas fa-save"
                                aria-hidden="true"
                            ></i>

                            Save Changes

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================================================
         PROFILE SCRIPT
         ========================================================= -->

    <script type="module">

        import "./firebase-profile.js";


        /* =========================================================
           HELPERS
           ========================================================= */

        const $ = (selector) =>
            document.querySelector(selector);


        const escapeHtml = (value) =>
            String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");


        function getCustomerName(user, profile = null) {

            const name =
                profile?.displayName ||
                user?.displayName ||
                "";

            if (String(name).trim()) {
                return String(name).trim();
            }

            if (user?.email) {
                return user.email
                    .split("@")[0]
                    .trim();
            }

            return "Profile";
        }


        function showToast(message, type = "success") {

            let root =
                document.querySelector(".profile-toast-root");

            if (!root) {

                root = document.createElement("div");

                root.className =
                    "profile-toast-root";

                Object.assign(root.style, {

                    position: "fixed",

                    bottom: "25px",

                    right: "25px",

                    zIndex: "999999",

                });

                document.body.appendChild(root);

            }


            const toast =
                document.createElement("div");

            Object.assign(toast.style, {

                padding: "13px 17px",

                marginTop: "10px",

                borderRadius: "9px",

                background:
                    type === "error"
                        ? "#d62828"
                        : "#088178",

                color: "#ffffff",

                fontSize: "14px",

                boxShadow:
                    "0 8px 25px rgba(0,0,0,.18)",

            });


            toast.textContent = message;

            root.appendChild(toast);


            setTimeout(() => {

                toast.remove();

            }, 3200);

        }


        /* =========================================================
           AVATAR
           ========================================================= */

        function renderAvatar(
            element,
            user,
            profile
        ) {

            if (!element) {
                return;
            }


            const photoURL =
                profile?.photoURL ||
                user?.photoURL ||
                "";


            const name =
                getCustomerName(
                    user,
                    profile
                );


            if (photoURL) {

                element.innerHTML = `
                    <img
                        src="${escapeHtml(photoURL)}"
                        alt="${escapeHtml(name)}"
                    >
                `;

                return;

            }


            const initial =
                name
                    .charAt(0)
                    .toUpperCase();


            element.innerHTML = `

                <span
                    class="profile-avatar-initial"
                >
                    ${escapeHtml(initial || "U")}
                </span>

            `;

        }


        /* =========================================================
           LOAD PROFILE
           ========================================================= */

        async function loadProfile(user) {

            const loading =
                $("#profileLoading");

            const card =
                $("#profileCard");

            const errorBox =
                $("#profileError");


            try {

                if (!user) {

                    loading.hidden = true;

                    card.hidden = true;

                    errorBox.hidden = false;

                    $("#profileErrorMessage").textContent =
                        "You need to sign in before accessing your profile.";

                    return;

                }


                const profile =
                    await window.SLProfile.getProfile();


                const customerName =
                    getCustomerName(
                        user,
                        profile
                    );


                /* =================================================
                   HEADER
                   ================================================= */

                $("#profileName").textContent =
                    customerName;


                $("#profileEmail").textContent =
                    profile.email ||
                    user.email ||
                    "";


                /* =================================================
                   FORM
                   ================================================= */

                $("#profileDisplayName").value =
                    profile.displayName || "";


                $("#profileEmailInput").value =
                    profile.email ||
                    user.email ||
                    "";


                $("#profilePhone").value =
                    profile.phone || "";


                $("#profileAddress").value =
                    profile.address || "";


                $("#profileCity").value =
                    profile.city || "";


                $("#profilePostalCode").value =
                    profile.postalCode || "";


                $("#profileCountry").value =
                    profile.country || "";


                /* =================================================
                   AVATARS
                   ================================================= */

                renderAvatar(
                    $("#profileAvatar"),
                    user,
                    profile
                );


                renderAvatar(
                    $("#profileTopAvatar"),
                    user,
                    profile
                );


                loading.hidden = true;

                errorBox.hidden = true;

                card.hidden = false;


            } catch (error) {

                console.error(
                    "[SneakersLink] Profile loading failed:",
                    error
                );


                loading.hidden = true;

                card.hidden = true;

                errorBox.hidden = false;


                $("#profileErrorMessage").textContent =
                    error?.message ||
                    "We couldn't load your profile.";

            }

        }


        /* =========================================================
           WAIT FOR PROFILE ENGINE
           ========================================================= */

        function startProfile() {

            if (
                !window.SLProfile ||
                typeof window.SLProfile.onProfileAuthChange !==
                    "function"
            ) {

                window.addEventListener(
                    "slprofile:ready",
                    startProfile,
                    {
                        once: true
                    }
                );

                return;

            }


            window.SLProfile.onProfileAuthChange(
                (user) => {

                    loadProfile(user);

                }
            );

        }


        /* =========================================================
           SAVE PROFILE
           ========================================================= */

        async function saveProfile(event) {

            event.preventDefault();


            const button =
                $("#saveProfileBtn");


            const originalHTML =
                button.innerHTML;


            button.disabled = true;

            button.innerHTML = `
                <i
                    class="fas fa-spinner fa-spin"
                    aria-hidden="true"
                ></i>

                Saving...
            `;


            try {

                const profile =
                    await window.SLProfile.updateProfile({

                        displayName:
                            $("#profileDisplayName")
                                .value,

                        phone:
                            $("#profilePhone")
                                .value,

                        address:
                            $("#profileAddress")
                                .value,

                        city:
                            $("#profileCity")
                                .value,

                        postalCode:
                            $("#profilePostalCode")
                                .value,

                        country:
                            $("#profileCountry")
                                .value,

                    });


                const user =
                    window.SLProfile
                        .getCurrentUser();


                const customerName =
                    getCustomerName(
                        user,
                        profile
                    );


                $("#profileName")
                    .textContent =
                    customerName;


                renderAvatar(
                    $("#profileAvatar"),
                    user,
                    profile
                );


                renderAvatar(
                    $("#profileTopAvatar"),
                    user,
                    profile
                );


                showToast(
                    "Your profile has been updated successfully."
                );


            } catch (error) {

                console.error(
                    "[SneakersLink] Profile update failed:",
                    error
                );


                showToast(
                    error?.message ||
                    "We couldn't update your profile.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.innerHTML =
                    originalHTML;

            }

        }


        /* =========================================================
           UPLOAD PHOTO
           ========================================================= */

        async function uploadPhoto(file) {

            if (!file) {
                return;
            }


            try {

                const url =
                    await window.SLProfile
                        .uploadAvatar(file);


                const user =
                    window.SLProfile
                        .getCurrentUser();


                const profile =
                    await window.SLProfile
                        .getProfile();


                profile.photoURL = url;


                renderAvatar(
                    $("#profileAvatar"),
                    user,
                    profile
                );


                renderAvatar(
                    $("#profileTopAvatar"),
                    user,
                    profile
                );


                showToast(
                    "Profile picture updated."
                );


            } catch (error) {

                console.error(
                    "[SneakersLink] Avatar upload failed:",
                    error
                );


                showToast(
                    error?.message ||
                    "We couldn't upload your profile picture.",
                    "error"
                );

            }

        }


        /* =========================================================
           REMOVE PHOTO
           ========================================================= */

        async function removePhoto() {

            try {

                await window.SLProfile
                    .deleteAvatar();


                const user =
                    window.SLProfile
                        .getCurrentUser();


                const profile =
                    await window.SLProfile
                        .getProfile();


                profile.photoURL = "";


                renderAvatar(
                    $("#profileAvatar"),
                    user,
                    profile
                );


                renderAvatar(
                    $("#profileTopAvatar"),
                    user,
                    profile
                );


                showToast(
                    "Profile picture removed."
                );


            } catch (error) {

                console.error(
                    "[SneakersLink] Avatar removal failed:",
                    error
                );


                showToast(
                    error?.message ||
                    "We couldn't remove your profile picture.",
                    "error"
                );

            }

        }


        /* =========================================================
           SIGN OUT
           ========================================================= */

        async function signOut() {

            try {

                if (
                    window.SLAuth &&
                    typeof window.SLAuth.logout ===
                        "function"
                ) {

                    await window.SLAuth.logout();

                }


                window.location.href =
                    "index.html";


            } catch (error) {

                console.error(
                    "[SneakersLink] Sign out failed:",
                    error
                );


                showToast(
                    "Couldn't sign out. Please try again.",
                    "error"
                );

            }

        }


        /* =========================================================
           EVENTS
           ========================================================= */

        $("#profileForm")
            .addEventListener(
                "submit",
                saveProfile
            );


        $("#profileImageInput")
            .addEventListener(
                "change",
                (event) => {

                    const file =
                        event.target.files?.[0];

                    uploadPhoto(file);

                    event.target.value = "";

                }
            );


        $("#removeProfileImage")
            .addEventListener(
                "click",
                removePhoto
            );


        $("#profileSignOut")
            .addEventListener(
                "click",
                signOut
            );


        /* =========================================================
           PROFILE ICON
           ========================================================= */

        $("#profileTopAvatar")
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "profile.html";

                }
            );


        /* =========================================================
           START
           ========================================================= */

        startProfile();

    </script>

</body>

</html>
