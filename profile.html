<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile — SneakersLink</title>

    <meta
      name="description"
      content="Manage your SneakersLink Account."
    />

    <!-- =========================================================
         FONT AWESOME
         ========================================================= -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- =========================================================
         GOOGLE FONT
         ========================================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================================
         PREVENT THEME FLASH
         ---------------------------------------------------------
         Supports both:
             sl-theme
             sl_theme

         sl-theme is preferred because it matches the newer
         SneakersLink theme convention.
         ========================================================= -->

    <script>
      (function () {
        try {
          const themeKeys = ["sl-theme", "sl_theme"];

          let savedTheme = null;

          for (const key of themeKeys) {
            const value = localStorage.getItem(key);

            if (value === "dark" || value === "light") {
              savedTheme = value;
              break;
            }
          }

          if (savedTheme) {
            document.documentElement.setAttribute("data-theme", savedTheme);

            return;
          }

          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;

          document.documentElement.setAttribute(
            "data-theme",
            prefersDark ? "dark" : "light",
          );
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- =========================================================
         PAGE STYLES
         ========================================================= -->

    <style>
      /* =====================================================
           VARIABLES
           ===================================================== */

      :root {
        --sl-bg: #f7f7f8;

        --sl-surface: #ffffff;

        --sl-surface-soft: #f3f4f6;

        --sl-text: #111111;

        --sl-text-secondary: #6b7280;

        --sl-border: #e5e7eb;

        --sl-primary: #111111;

        --sl-primary-text: #ffffff;

        --sl-danger: #dc2626;

        --sl-success: #16a34a;

        --sl-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);

        --sl-radius: 20px;

        --sl-transition: 0.25s ease;
      }

      /* =====================================================
           DARK THEME
           ===================================================== */

      html[data-theme="dark"] {
        --sl-bg: #0d0f12;

        --sl-surface: #15181d;

        --sl-surface-soft: #1d2128;

        --sl-text: #f5f5f5;

        --sl-text-secondary: #a5abb5;

        --sl-border: #2a2f38;

        --sl-primary: #ffffff;

        --sl-primary-text: #111111;

        --sl-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
      }

      /* =====================================================
           RESET
           ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;

        background: var(--sl-bg);

        color: var(--sl-text);

        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        transition:
          background var(--sl-transition),
          color var(--sl-transition);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* =====================================================
           PAGE HEADER
           ===================================================== */

      .profile-header {
        width: 100%;

        height: 76px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 32px;

        background: var(--sl-surface);

        border-bottom: 1px solid var(--sl-border);

        position: sticky;

        top: 0;

        z-index: 100;

        transition:
          background var(--sl-transition),
          border-color var(--sl-transition);
      }

      /* =====================================================
           BACK BUTTON
           ===================================================== */

      .profile-back {
        display: inline-flex;

        align-items: center;

        gap: 9px;

        padding: 10px 15px;

        border: 1px solid var(--sl-border);

        border-radius: 12px;

        background: var(--sl-surface);

        color: var(--sl-text);

        font-size: 14px;

        font-weight: 500;

        transition: all var(--sl-transition);
      }

      .profile-back:hover {
        background: var(--sl-surface-soft);

        transform: translateX(-2px);
      }

      .profile-back i {
        font-size: 13px;
      }

      /* =====================================================
           HEADER PROFILE ICON
           ===================================================== */

      .header-profile-button {
        width: 44px;

        height: 44px;

        border: 1px solid var(--sl-border);

        border-radius: 50%;

        background: var(--sl-surface-soft);

        color: var(--sl-text);

        display: flex;

        align-items: center;

        justify-content: center;

        overflow: hidden;

        transition: all var(--sl-transition);
      }

      .header-profile-button:hover {
        transform: translateY(-1px);

        border-color: var(--sl-text);
      }

      .header-profile-button img {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: none;
      }

      .header-profile-button.has-image img {
        display: block;
      }

      .header-profile-button.has-image i {
        display: none;
      }

      /* =====================================================
           MAIN
           ===================================================== */

      .profile-page {
        width: 100%;

        max-width: 1080px;

        margin: 0 auto;

        padding: 45px 24px 70px;
      }

      /* =====================================================
           PAGE INTRO
           ===================================================== */

      .profile-intro {
        margin-bottom: 30px;
      }

      .profile-intro h1 {
        font-size: clamp(28px, 4vw, 38px);

        line-height: 1.15;

        font-weight: 700;

        letter-spacing: -0.8px;

        margin-bottom: 8px;
      }

      .profile-intro p {
        color: var(--sl-text-secondary);

        font-size: 14px;

        line-height: 1.6;
      }

      /* =====================================================
           PROFILE CARD
           ===================================================== */

      .profile-card {
        background: var(--sl-surface);

        border: 1px solid var(--sl-border);

        border-radius: var(--sl-radius);

        box-shadow: var(--sl-shadow);

        overflow: hidden;

        transition:
          background var(--sl-transition),
          border-color var(--sl-transition);
      }

      /* =====================================================
           PROFILE HERO
           ===================================================== */

      .profile-hero {
        padding: 32px;

        display: flex;

        align-items: center;

        gap: 24px;

        border-bottom: 1px solid var(--sl-border);
      }

      /* =====================================================
           AVATAR
           ===================================================== */

      .profile-avatar-wrapper {
        position: relative;

        flex: 0 0 auto;
      }

      .profile-avatar {
        width: 112px;

        height: 112px;

        border-radius: 50%;

        background: var(--sl-surface-soft);

        border: 1px solid var(--sl-border);

        display: flex;

        align-items: center;

        justify-content: center;

        overflow: hidden;

        color: var(--sl-text-secondary);

        font-size: 38px;
      }

      .profile-avatar img {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: none;
      }

      .profile-avatar.has-image img {
        display: block;
      }

      .profile-avatar.has-image i {
        display: none;
      }

      /* =====================================================
           AVATAR EDIT BUTTON
           ===================================================== */

      .avatar-edit-button {
        position: absolute;

        right: 2px;

        bottom: 2px;

        width: 34px;

        height: 34px;

        border: 3px solid var(--sl-surface);

        border-radius: 50%;

        background: var(--sl-primary);

        color: var(--sl-primary-text);

        display: flex;

        align-items: center;

        justify-content: center;

        transition: transform var(--sl-transition);
      }

      .avatar-edit-button:hover {
        transform: scale(1.08);
      }

      .avatar-edit-button i {
        font-size: 13px;
      }

      /* =====================================================
           PROFILE SUMMARY
           ===================================================== */

      .profile-summary {
        min-width: 0;
      }

      .profile-summary h2 {
        font-size: 24px;

        font-weight: 700;

        line-height: 1.3;

        margin-bottom: 4px;

        word-break: break-word;
      }

      .profile-summary p {
        color: var(--sl-text-secondary);

        font-size: 13px;

        line-height: 1.5;

        word-break: break-word;
      }

      .profile-summary .profile-status {
        display: inline-flex;

        align-items: center;

        gap: 6px;

        margin-top: 10px;

        padding: 5px 10px;

        border-radius: 999px;

        background: var(--sl-surface-soft);

        color: var(--sl-text-secondary);

        font-size: 11px;

        font-weight: 500;
      }

      .profile-status i {
        font-size: 7px;
      }

      /* =====================================================
           FORM AREA
           ===================================================== */

      .profile-form {
        padding: 32px;
      }

      .section-heading {
        margin-bottom: 22px;
      }

      .section-heading h3 {
        font-size: 18px;

        font-weight: 600;

        margin-bottom: 4px;
      }

      .section-heading p {
        color: var(--sl-text-secondary);

        font-size: 12px;
      }

      /* =====================================================
           FORM GRID
           ===================================================== */

      .form-grid {
        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 20px;
      }

      .form-group {
        display: flex;

        flex-direction: column;

        gap: 7px;
      }

      .form-group.full-width {
        grid-column: 1 / -1;
      }

      .form-label {
        font-size: 12px;

        font-weight: 600;

        color: var(--sl-text);
      }

      .form-input {
        width: 100%;

        min-height: 48px;

        padding: 12px 14px;

        border: 1px solid var(--sl-border);

        border-radius: 12px;

        outline: none;

        background: var(--sl-surface);

        color: var(--sl-text);

        font-size: 13px;

        transition: all var(--sl-transition);
      }

      .form-input::placeholder {
        color: var(--sl-text-secondary);
      }

      .form-input:focus {
        border-color: var(--sl-text);

        box-shadow: 0 0 0 3px rgba(128, 128, 128, 0.12);
      }

      .form-input:disabled {
        opacity: 0.65;

        cursor: not-allowed;

        background: var(--sl-surface-soft);
      }

      /* =====================================================
           ACTIONS
           ===================================================== */

      .profile-actions {
        margin-top: 30px;

        padding-top: 24px;

        border-top: 1px solid var(--sl-border);

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;
      }

      .avatar-actions {
        display: flex;

        align-items: center;

        gap: 8px;

        flex-wrap: wrap;
      }

      .button {
        min-height: 44px;

        padding: 10px 17px;

        border: 1px solid var(--sl-border);

        border-radius: 11px;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        font-size: 12px;

        font-weight: 600;

        transition: all var(--sl-transition);
      }

      .button-primary {
        background: var(--sl-primary);

        color: var(--sl-primary-text);

        border-color: var(--sl-primary);
      }

      .button-primary:hover {
        opacity: 0.88;

        transform: translateY(-1px);
      }

      .button-secondary {
        background: var(--sl-surface);

        color: var(--sl-text);
      }

      .button-secondary:hover {
        background: var(--sl-surface-soft);
      }

      .button-danger {
        background: transparent;

        color: var(--sl-danger);

        border-color: rgba(220, 38, 38, 0.25);
      }

      .button-danger:hover {
        background: rgba(220, 38, 38, 0.08);
      }

      .button:disabled {
        opacity: 0.55;

        cursor: not-allowed;

        transform: none;
      }

      /* =====================================================
           STATUS MESSAGE
           ===================================================== */

      .profile-message {
        display: none;

        margin-bottom: 20px;

        padding: 12px 14px;

        border-radius: 12px;

        font-size: 12px;

        line-height: 1.5;
      }

      .profile-message.show {
        display: flex;

        align-items: center;

        gap: 9px;
      }

      .profile-message.success {
        background: rgba(22, 163, 74, 0.1);

        color: var(--sl-success);
      }

      .profile-message.error {
        background: rgba(220, 38, 38, 0.1);

        color: var(--sl-danger);
      }

      /* =====================================================
           LOADING
           ===================================================== */

      .profile-loading {
        min-height: 400px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 14px;

        color: var(--sl-text-secondary);

        font-size: 13px;
      }

      .loading-spinner {
        width: 34px;

        height: 34px;

        border: 3px solid var(--sl-border);

        border-top-color: var(--sl-text);

        border-radius: 50%;

        animation: profileSpin 0.8s linear infinite;
      }

      @keyframes profileSpin {
        to {
          transform: rotate(360deg);
        }
      }

      /* =====================================================
           ERROR STATE
           ===================================================== */

      .profile-error {
        display: none;

        padding: 40px 25px;

        text-align: center;
      }

      .profile-error.show {
        display: block;
      }

      .profile-error-icon {
        width: 58px;

        height: 58px;

        margin: 0 auto 16px;

        border-radius: 50%;

        background: rgba(220, 38, 38, 0.1);

        color: var(--sl-danger);

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 21px;
      }

      .profile-error h2 {
        font-size: 20px;

        margin-bottom: 7px;
      }

      .profile-error p {
        max-width: 520px;

        margin: 0 auto 20px;

        color: var(--sl-text-secondary);

        font-size: 13px;

        line-height: 1.6;
      }

      /* =====================================================
           HIDDEN FILE INPUT
           ===================================================== */

      #avatarFileInput {
        display: none;
      }

      /* =====================================================
           FOOTER
           ===================================================== */

      .profile-footer {
        text-align: center;

        color: var(--sl-text-secondary);

        font-size: 11px;

        padding: 20px;
      }

      /* =====================================================
           MOBILE
           ===================================================== */

      @media (max-width: 700px) {
        .profile-header {
          height: 68px;

          padding: 0 16px;
        }

        .profile-back {
          padding: 9px 12px;

          font-size: 12px;
        }

        .header-profile-button {
          width: 40px;

          height: 40px;
        }

        .profile-page {
          padding: 28px 14px 50px;
        }

        .profile-intro {
          margin-bottom: 20px;
        }

        .profile-intro h1 {
          font-size: 27px;
        }

        .profile-hero {
          padding: 24px 20px;

          flex-direction: column;

          text-align: center;
        }

        .profile-avatar {
          width: 100px;

          height: 100px;
        }

        .profile-summary h2 {
          font-size: 20px;
        }

        .profile-form {
          padding: 24px 20px;
        }

        .form-grid {
          grid-template-columns: 1fr;

          gap: 16px;
        }

        .form-group.full-width {
          grid-column: auto;
        }

        .profile-actions {
          flex-direction: column;

          align-items: stretch;
        }

        .avatar-actions {
          width: 100%;
        }

        .avatar-actions .button {
          flex: 1;
        }

        .save-button {
          width: 100%;
        }
      }

      /* =====================================================
           SMALL MOBILE
           ===================================================== */

      @media (max-width: 400px) {
        .profile-page {
          padding-left: 10px;

          padding-right: 10px;
        }

        .profile-form {
          padding: 20px 15px;
        }

        .profile-hero {
          padding: 22px 15px;
        }

        .profile-back span {
          display: none;
        }

        .profile-back {
          width: 40px;

          height: 40px;

          justify-content: center;

          padding: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="profile-header">
      <button
        type="button"
        class="profile-back"
        id="backButton"
        aria-label="Go back"
      >
        <i class="fas fa-arrow-left" aria-hidden="true"></i>

        <span> Back </span>
      </button>

      <button
        type="button"
        class="header-profile-button"
        id="headerProfileButton"
        aria-label="Profile"
      >
        <i class="fas fa-user" aria-hidden="true"></i>

        <img id="headerProfileImage" src="" alt="" />
      </button>
    </header>

    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main class="profile-page">
      <div class="profile-intro">
        <h1>My Profile</h1>

        <p>Manage your SneakerLink Account.</p>
      </div>

      <section class="profile-card">
        <!-- =================================================
                 LOADING STATE
                 ================================================= -->

        <div class="profile-loading" id="profileLoading">
          <div class="loading-spinner" aria-hidden="true"></div>

          <span id="loadingText"> Loading your profile... </span>
        </div>

        <!-- =================================================
                 ERROR STATE
                 ================================================= -->

        <div class="profile-error" id="profileError">
          <div class="profile-error-icon">
            <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          </div>

          <h2>Unable to load profile</h2>

          <p id="profileErrorText">We couldn't load your profile.</p>

          <a href="login.html?mode=login" class="button button-primary">
            <i class="fas fa-right-to-bracket" aria-hidden="true"></i>

            Sign In
          </a>
        </div>

        <!-- =================================================
                 PROFILE CONTENT
                 ================================================= -->

        <div id="profileContent" hidden>
          <div class="profile-hero">
            <!-- Avatar -->

            <div class="profile-avatar-wrapper">
              <div class="profile-avatar" id="profileAvatar">
                <i class="fas fa-user" aria-hidden="true"></i>

                <img id="profileAvatarImage" src="" alt="Profile photo" />
              </div>

              <button
                type="button"
                class="avatar-edit-button"
                id="avatarEditButton"
                aria-label="Change profile photo"
                title="Change profile photo"
              >
                <i class="fas fa-camera" aria-hidden="true"></i>
              </button>
            </div>

            <!-- Summary -->

            <div class="profile-summary">
              <h2 id="profileName">Profile</h2>

              <p id="profileEmail">—</p>

              <span class="profile-status" id="profileStatus">
                <i class="fas fa-circle" aria-hidden="true"></i>

                Account active
              </span>
            </div>
          </div>

          <!-- =================================================
                     FORM
                     ================================================= -->

          <form class="profile-form" id="profileForm" novalidate>
            <div
              class="profile-message"
              id="profileMessage"
              role="status"
              aria-live="polite"
            >
              <i class="fas fa-circle-check" aria-hidden="true"></i>

              <span id="profileMessageText"></span>
            </div>

            <div class="section-heading">
              <h3>Personal Information</h3>

              <p>Keep your customer details up to date.</p>
            </div>

            <div class="form-grid">
              <!-- Name -->

              <div class="form-group">
                <label class="form-label" for="displayName"> Full Name </label>

                <input
                  type="text"
                  id="displayName"
                  name="displayName"
                  class="form-input"
                  placeholder="Enter your full name"
                  autocomplete="name"
                />
              </div>

              <!-- Email -->

              <div class="form-group">
                <label class="form-label" for="email"> Email Address </label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="Email address"
                  autocomplete="email"
                  disabled
                />
              </div>

              <!-- Phone -->

              <div class="form-group">
                <label class="form-label" for="phone"> Phone Number </label>

                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-input"
                  placeholder="Enter your phone number"
                  autocomplete="tel"
                />
              </div>

              <!-- Country -->

              <div class="form-group">
                <label class="form-label" for="country"> Country </label>

                <input
                  type="text"
                  id="country"
                  name="country"
                  class="form-input"
                  placeholder="Enter your country"
                  autocomplete="country-name"
                />
              </div>

              <!-- Address -->

              <div class="form-group full-width">
                <label class="form-label" for="address"> Address </label>

                <input
                  type="text"
                  id="address"
                  name="address"
                  class="form-input"
                  placeholder="Enter your address"
                  autocomplete="street-address"
                />
              </div>

              <!-- City -->

              <div class="form-group">
                <label class="form-label" for="city"> City </label>

                <input
                  type="text"
                  id="city"
                  name="city"
                  class="form-input"
                  placeholder="Enter your city"
                  autocomplete="address-level2"
                />
              </div>

              <!-- Postal Code -->

              <div class="form-group">
                <label class="form-label" for="postalCode"> Postal Code </label>

                <input
                  type="text"
                  id="postalCode"
                  name="postalCode"
                  class="form-input"
                  placeholder="Enter postal code"
                  autocomplete="postal-code"
                />
              </div>
            </div>

            <!-- =================================================
                         ACTIONS
                         ================================================= -->

            <div class="profile-actions">
              <div class="avatar-actions">
                <button
                  type="button"
                  class="button button-secondary"
                  id="changePhotoButton"
                >
                  <i class="fas fa-camera" aria-hidden="true"></i>

                  Change Photo
                </button>

                <button
                  type="button"
                  class="button button-danger"
                  id="removePhotoButton"
                  style="display: none"
                >
                  <i class="fas fa-trash" aria-hidden="true"></i>

                  Remove
                </button>
              </div>

              <button
                type="submit"
                class="button button-primary save-button"
                id="saveProfileButton"
              >
                <i class="fas fa-check" aria-hidden="true"></i>

                Save Changes
              </button>
            </div>
          </form>
        </div>
      </section>

      <div class="profile-footer">SneakersLink</div>
    </main>

    <!-- =========================================================
         HIDDEN FILE INPUT
         ========================================================= -->

    <input
      type="file"
      id="avatarFileInput"
      accept="image/jpeg,image/png,image/webp,image/gif"
    />

    <!-- =========================================================
         FIREBASE PROFILE ENGINE
         ========================================================= -->

    <script type="module" src="./firebase-profile.js"></script>

    <!-- =========================================================
         PROFILE PAGE ENGINE
         ========================================================= -->

    <script>
      (() => {
        "use strict";

        /* =================================================
               ELEMENTS
               ================================================= */

        const loading = document.getElementById("profileLoading");

        const loadingText = document.getElementById("loadingText");

        const errorState = document.getElementById("profileError");

        const errorText = document.getElementById("profileErrorText");

        const content = document.getElementById("profileContent");

        const profileForm = document.getElementById("profileForm");

        const profileName = document.getElementById("profileName");

        const profileEmail = document.getElementById("profileEmail");

        const emailInput = document.getElementById("email");

        const displayNameInput = document.getElementById("displayName");

        const phoneInput = document.getElementById("phone");

        const addressInput = document.getElementById("address");

        const cityInput = document.getElementById("city");

        const postalCodeInput = document.getElementById("postalCode");

        const countryInput = document.getElementById("country");

        const profileAvatar = document.getElementById("profileAvatar");

        const profileAvatarImage =
          document.getElementById("profileAvatarImage");

        const headerProfileButton = document.getElementById(
          "headerProfileButton",
        );

        const headerProfileImage =
          document.getElementById("headerProfileImage");

        const avatarFileInput = document.getElementById("avatarFileInput");

        const avatarEditButton = document.getElementById("avatarEditButton");

        const changePhotoButton = document.getElementById("changePhotoButton");

        const removePhotoButton = document.getElementById("removePhotoButton");

        const saveButton = document.getElementById("saveProfileButton");

        const message = document.getElementById("profileMessage");

        const messageText = document.getElementById("profileMessageText");

        const backButton = document.getElementById("backButton");

        /* =================================================
               STATE
               ================================================= */

        let currentProfile = null;

        let profileLoaded = false;

        let uploadInProgress = false;

        let messageTimeout = null;

        /* =================================================
               THEME
               -------------------------------------------------
               Supports BOTH historical SneakersLink keys:
                   sl-theme
                   sl_theme
               ================================================= */

        function getSavedTheme() {
          try {
            const preferred = localStorage.getItem("sl-theme");

            if (preferred === "dark" || preferred === "light") {
              return preferred;
            }

            const legacy = localStorage.getItem("sl_theme");

            if (legacy === "dark" || legacy === "light") {
              return legacy;
            }
          } catch (error) {
            console.warn("Unable to read saved theme.", error);
          }

          return null;
        }

        function applyTheme(theme) {
          if (theme !== "dark" && theme !== "light") {
            return;
          }

          document.documentElement.setAttribute("data-theme", theme);
        }

        function initialiseTheme() {
          const savedTheme = getSavedTheme();

          if (savedTheme) {
            applyTheme(savedTheme);

            return;
          }

          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;

          applyTheme(prefersDark ? "dark" : "light");
        }

        initialiseTheme();

        /*
         * Keep the page synchronized with the rest
         * of the SneakersLink site.
         */

        window.addEventListener("storage", (event) => {
          if (event.key === "sl-theme" || event.key === "sl_theme") {
            applyTheme(event.newValue);
          }
        });

        /*
         * Some site scripts change the theme in the
         * same browser tab. Storage events do not fire
         * in the same document, so also listen for the
         * custom events used by common theme toggles.
         */

        window.addEventListener("sl:themechange", (event) => {
          const theme = event?.detail?.theme;

          if (theme === "dark" || theme === "light") {
            applyTheme(theme);
          }
        });

        window.addEventListener("themechange", (event) => {
          const theme = event?.detail?.theme || event?.detail;

          if (theme === "dark" || theme === "light") {
            applyTheme(theme);
          }
        });

        /* =================================================
               HELPERS
               ================================================= */

        function showLoading(text = "Loading your profile...") {
          loading.hidden = false;

          loadingText.textContent = text;

          errorState.classList.remove("show");

          content.hidden = true;
        }

        function showContent() {
          loading.hidden = true;

          errorState.classList.remove("show");

          content.hidden = false;

          profileLoaded = true;
        }

        function showError(error) {
          console.error("SneakersLink profile error:", error);

          loading.hidden = true;

          content.hidden = true;

          errorState.classList.add("show");

          let text = "We couldn't load your profile. Please try again.";

          if (error && error.message) {
            text = error.message;
          }

          errorText.textContent = text;
        }

        function showMessage(text, type = "success") {
          message.className = "profile-message show " + type;

          messageText.textContent = text;

          const icon = message.querySelector("i");

          if (type === "error") {
            icon.className = "fas fa-circle-exclamation";
          } else {
            icon.className = "fas fa-circle-check";
          }

          if (messageTimeout) {
            clearTimeout(messageTimeout);
          }

          messageTimeout = setTimeout(() => {
            message.className = "profile-message";
            messageTimeout = null;
          }, 4500);
        }

        /*
         * Promise timeout helper.
         *
         * Prevents Firestore or Storage from leaving
         * the UI in an endless loading state.
         */

        function withTimeout(promise, milliseconds, timeoutMessage) {
          return Promise.race([
            promise,

            new Promise((_, reject) => {
              setTimeout(() => {
                reject(new Error(timeoutMessage));
              }, milliseconds);
            }),
          ]);
        }

        function setButtonLoading(button, loadingState, loadingTextValue) {
          if (!button) {
            return;
          }

          if (loadingState) {
            if (!button.dataset.originalText) {
              button.dataset.originalText = button.innerHTML;
            }

            button.disabled = true;

            button.innerHTML = `
                        <i class="fas fa-spinner fa-spin"></i>
                        ${loadingTextValue}
                        `;
          } else {
            button.disabled = false;

            if (button.dataset.originalText) {
              button.innerHTML = button.dataset.originalText;

              delete button.dataset.originalText;
            }
          }
        }

        /* =================================================
               AVATAR DISPLAY
               ================================================= */

        function setAvatar(photoURL) {
          const validURL =
            typeof photoURL === "string" && photoURL.trim() !== "";

          if (validURL) {
            profileAvatarImage.src = photoURL;

            profileAvatarImage.alt = "Profile photo";

            profileAvatar.classList.add("has-image");

            headerProfileImage.src = photoURL;

            headerProfileImage.alt = "Profile photo";

            headerProfileButton.classList.add("has-image");

            removePhotoButton.style.display = "inline-flex";
          } else {
            profileAvatarImage.removeAttribute("src");

            profileAvatar.classList.remove("has-image");

            headerProfileImage.removeAttribute("src");

            headerProfileButton.classList.remove("has-image");

            removePhotoButton.style.display = "none";
          }
        }

        /* =================================================
               POPULATE PROFILE
               ================================================= */

        function populateProfile(profile) {
          currentProfile = profile;

          const name = profile?.displayName || "Profile";

          const email = profile?.email || "No email available";

          profileName.textContent = name;

          profileEmail.textContent = email;

          displayNameInput.value = profile?.displayName || "";

          emailInput.value = profile?.email || "";

          phoneInput.value = profile?.phone || "";

          addressInput.value = profile?.address || "";

          cityInput.value = profile?.city || "";

          postalCodeInput.value = profile?.postalCode || "";

          countryInput.value = profile?.country || "";

          setAvatar(profile?.photoURL || "");
        }

        /* =================================================
               WAIT FOR PROFILE ENGINE
               ================================================= */

        function waitForProfileEngine() {
          return new Promise((resolve, reject) => {
            if (window.SLProfile) {
              resolve(window.SLProfile);

              return;
            }

            let finished = false;

            const cleanup = () => {
              window.removeEventListener("slprofile:ready", readyHandler);

              clearTimeout(timeout);
            };

            const readyHandler = () => {
              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              if (window.SLProfile) {
                resolve(window.SLProfile);
              } else {
                reject(
                  new Error(
                    "Firebase profile engine initialized without exposing the profile API.",
                  ),
                );
              }
            };

            const timeout = setTimeout(() => {
              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Firebase profile engine did not load. Check firebase-profile.js and firebase-config.js.",
                ),
              );
            }, 12000);

            window.addEventListener("slprofile:ready", readyHandler);
          });
        }

        /* =================================================
               WAIT FOR AUTHENTICATED USER
               -------------------------------------------------
               IMPORTANT:
               Firebase can initially report null while it
               restores the persisted session.

               Therefore a temporary null is NOT immediately
               treated as a logged-out user.
               ================================================= */

        function waitForAuthenticatedUser() {
          return new Promise((resolve) => {
            if (
              !window.SLProfile ||
              typeof window.SLProfile.onProfileAuthChange !== "function"
            ) {
              resolve(null);

              return;
            }

            let finished = false;

            let unsubscribe = null;

            const finish = (user) => {
              if (finished) {
                return;
              }

              finished = true;

              clearTimeout(timeout);

              if (typeof unsubscribe === "function") {
                try {
                  unsubscribe();
                } catch (error) {
                  console.warn(
                    "Unable to unsubscribe from auth listener.",
                    error,
                  );
                }
              }

              resolve(user || null);
            };

            /*
             * Give Firebase enough time to restore
             * the existing authenticated session.
             */

            const timeout = setTimeout(() => {
              const currentUser = window.SLProfile.getCurrentUser();

              finish(currentUser);
            }, 12000);

            try {
              unsubscribe = window.SLProfile.onProfileAuthChange((user) => {
                /*
                 * Do NOT finish on
                 * temporary null.
                 */

                if (!user) {
                  const currentUser = window.SLProfile.getCurrentUser();

                  if (currentUser) {
                    finish(currentUser);
                  }

                  return;
                }

                finish(user);
              });
            } catch (error) {
              console.error("Auth listener error:", error);

              finish(window.SLProfile.getCurrentUser());
            }
          });
        }

        /* =================================================
               LOAD PROFILE
               ================================================= */

        async function loadProfile() {
          showLoading("Checking your account...");

          try {
            /*
             * Wait for firebase-profile.js.
             */

            await waitForProfileEngine();

            if (!window.SLProfile) {
              throw new Error(
                "The Firebase profile engine could not be loaded.",
              );
            }

            /*
             * Wait for Firebase Authentication.
             */

            showLoading("Checking your account...");

            const user = await waitForAuthenticatedUser();

            /*
             * Only redirect after Firebase has had
             * enough time to restore authentication.
             */

            if (!user) {
              window.location.href = "login.html?mode=login";

              return;
            }

            /*
             * Load Firestore profile with a hard timeout.
             */

            showLoading("Loading your profile...");

            const profile = await withTimeout(
              window.SLProfile.getProfile(),
              15000,
              "Your profile request timed out. Please check your Firebase connection and Firestore configuration.",
            );

            populateProfile(profile);

            /*
             * Profile is fully rendered BEFORE the
             * loading state is removed.
             */

            showContent();
          } catch (error) {
            showError(error);
          }
        }

        /* =================================================
               LIVE NAME UPDATE
               ================================================= */

        displayNameInput.addEventListener("input", () => {
          const name = displayNameInput.value.trim();

          profileName.textContent = name || "Profile";
        });

        /* =================================================
               OPEN FILE PICKER
               ================================================= */

        function openFilePicker() {
          if (uploadInProgress) {
            return;
          }

          avatarFileInput.click();
        }

        avatarEditButton.addEventListener("click", openFilePicker);

        changePhotoButton.addEventListener("click", openFilePicker);

        /* =================================================
               AVATAR UPLOAD
               ================================================= */

        avatarFileInput.addEventListener("change", async () => {
          if (uploadInProgress) {
            return;
          }

          const file = avatarFileInput.files?.[0];

          if (!file) {
            return;
          }

          uploadInProgress = true;

          try {
            /*
             * Client-side validation.
             */

            if (!file.type || !file.type.startsWith("image/")) {
              throw new Error("Please select a valid image file.");
            }

            const maxSize = 5 * 1024 * 1024;

            if (file.size > maxSize) {
              throw new Error("Profile images must be smaller than 5 MB.");
            }

            /*
             * Disable all avatar actions while
             * upload is running.
             */

            setButtonLoading(changePhotoButton, true, "Uploading...");

            avatarEditButton.disabled = true;

            removePhotoButton.disabled = true;

            /*
             * Upload with timeout.
             *
             * This is important because the old
             * implementation could remain at
             * "Uploading..." indefinitely if Storage
             * was unavailable or blocked by rules.
             */

            const downloadURL = await withTimeout(
              window.SLProfile.uploadAvatar(file),
              30000,
              "Profile photo upload timed out. Please check your Firebase Storage configuration and try again.",
            );

            if (!downloadURL) {
              throw new Error(
                "Firebase uploaded the image but did not return a download URL.",
              );
            }

            /*
             * Update UI immediately.
             */

            setAvatar(downloadURL);

            if (currentProfile) {
              currentProfile.photoURL = downloadURL;
            }

            showMessage("Profile photo updated successfully.");
          } catch (error) {
            console.error("Avatar upload error:", error);

            let errorMessage =
              error?.message || "Unable to upload your profile photo.";

            /*
             * Make Firebase Storage errors
             * easier for the customer to understand.
             */

            if (error?.code === "storage/unauthorized") {
              errorMessage =
                "Photo upload was denied by Firebase Storage rules. Please check your Storage security rules.";
            } else if (error?.code === "storage/unauthenticated") {
              errorMessage =
                "Your Firebase session has expired. Please sign in again.";
            } else if (error?.code === "storage/quota-exceeded") {
              errorMessage = "Firebase Storage quota has been exceeded.";
            } else if (error?.code === "storage/canceled") {
              errorMessage = "The profile photo upload was canceled.";
            }

            showMessage(errorMessage, "error");
          } finally {
            uploadInProgress = false;

            setButtonLoading(changePhotoButton, false);

            avatarEditButton.disabled = false;

            removePhotoButton.disabled = false;

            /*
             * Reset file input so the same image
             * can be selected again.
             */

            avatarFileInput.value = "";
          }
        });

        /* =================================================
               REMOVE AVATAR
               ================================================= */

        removePhotoButton.addEventListener("click", async () => {
          if (uploadInProgress) {
            return;
          }

          if (!currentProfile || !currentProfile.photoURL) {
            return;
          }

          const confirmed = window.confirm("Remove your profile photo?");

          if (!confirmed) {
            return;
          }

          uploadInProgress = true;

          try {
            setButtonLoading(removePhotoButton, true, "Removing...");

            avatarEditButton.disabled = true;

            changePhotoButton.disabled = true;

            await withTimeout(
              window.SLProfile.deleteAvatar(),
              20000,
              "Removing the profile photo timed out. Please try again.",
            );

            setAvatar("");

            if (currentProfile) {
              currentProfile.photoURL = "";
            }

            showMessage("Profile photo removed.");
          } catch (error) {
            console.error("Avatar removal error:", error);

            let errorMessage =
              error?.message || "Unable to remove your profile photo.";

            if (error?.code === "storage/unauthorized") {
              errorMessage =
                "Photo removal was denied by Firebase Storage rules. Please check your Storage security rules.";
            }

            showMessage(errorMessage, "error");
          } finally {
            setButtonLoading(removePhotoButton, false);

            avatarEditButton.disabled = false;

            changePhotoButton.disabled = false;
          }
        });

        /* =================================================
               SAVE PROFILE
               ================================================= */

        profileForm.addEventListener("submit", async (event) => {
          event.preventDefault();

          try {
            setButtonLoading(saveButton, true, "Saving...");

            const fields = {
              displayName: displayNameInput.value,

              phone: phoneInput.value,

              address: addressInput.value,

              city: cityInput.value,

              postalCode: postalCodeInput.value,

              country: countryInput.value,
            };

            const updatedProfile = await withTimeout(
              window.SLProfile.updateProfile(fields),
              15000,
              "Saving your profile timed out. Please check your connection and try again.",
            );

            populateProfile(updatedProfile);

            showMessage("Your profile has been saved successfully.");
          } catch (error) {
            console.error("Profile update error:", error);

            showMessage(
              error?.message || "Unable to save your profile.",
              "error",
            );
          } finally {
            setButtonLoading(saveButton, false);
          }
        });

        /* =================================================
               BACK BUTTON
               ================================================= */

        backButton.addEventListener("click", () => {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = "index.html";
          }
        });

        /* =================================================
               HEADER PROFILE BUTTON
               ================================================= */

        headerProfileButton.addEventListener("click", () => {
          window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
        });

        /* =================================================
               INITIALISE
               ================================================= */

        loadProfile();
      })();
    </script>
  </body>
</html>
